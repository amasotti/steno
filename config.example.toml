# Steno config — example. Copy to config.toml and adapt to your app.
#
#   cp config.example.toml config.toml
#   steno record --config config.toml --out ./runs/demo
#
# Everything here is optional: omitted keys keep Steno's built-in defaults, and
# running `steno record` with no --config reproduces the default behavior. An
# explicit --url on the command line overrides start_url below.
#
# NOTE: [target].start_url, [filter], and [payload] take effect today. Later
# sections are parsed and reserved for future slices (fact extraction,
# correlation, supplemental sources); they are shown here as commented examples
# and currently have no effect.

[target]
mode = "launch"                       # launch | attach  (only launch is used today)
browser = "chrome"                    # chrome | edge | brave | ...
start_url = "https://app.example.com" # where the headful browser opens

[filter]
# Resource-type allowlist — the single biggest noise cut. Keep meaningful
# traffic; drop Script/Stylesheet/Image/Font/Media/Manifest. These are the
# defaults; delete this line to accept them.
resource_types = ["Document", "XHR", "Fetch", "WebSocket"]

# Host allowlist — keep your first-party / system-of-interest origins, drop
# third-party analytics, CDNs and widgets. An empty list (or omitting the key)
# allows ALL hosts. "*.example.com" is a leading-wildcard suffix match: it
# matches api.example.com and auth.example.com but NOT the bare example.com, so
# list the apex separately if you want it.
allow_hosts = [
  "example.com",
  "*.example.com",
]

# Path denylist — prefix match. Drop health checks, favicons, polling and other
# low-signal endpoints. "/health" also matches "/healthz".
deny_paths = [
  "/favicon.ico",
  "/health",
]

# Drop CORS preflight requests (method == OPTIONS). Default: true.
drop_preflight = true

[payload]
# Request/response payloads for kept calls are written as side files under
# payloads/ and referenced from timeline.jsonl. Document bodies (usually HTML)
# are skipped by default to keep the artifacts useful. Set this true only when
# debugging a page document response itself.
include_documents = false
include_headers = true

